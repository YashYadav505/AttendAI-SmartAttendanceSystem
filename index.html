<!DOCTYPE html>
<html>
<head>
    <title>Smart Attendance</title>
    <style>
        body { text-align: center; font-family: Arial; }
        video { width: 400px; border-radius: 10px; margin-top: 10px; }
        button { padding: 12px 25px; font-size: 18px; margin-top: 10px; }
        #result { margin-top: 20px; font-size: 18px; font-weight: bold; color: #333; }
        #qr { margin-top: 20px; width: 200px; height: 200px; }
    </style>
</head>
<body>

<h1>Smart Attendance System</h1>

<video id="video" autoplay playsinline></video><br>
<button id="startBtn">Get Started</button>

<div id="result"></div>

<h2>Scan QR to open on another device</h2>
<img id="qr" src="data:image/png;base64,{{ qr_code }}" alt="QR Code">

<script src="{{ url_for('static', filename='server.js') }}"></script>
</body>
</html>
